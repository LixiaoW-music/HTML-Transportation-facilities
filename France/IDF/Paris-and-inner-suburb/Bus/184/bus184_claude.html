<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Affichage bus - Ligne 184</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .display {
    display: flex;
    align-items: center;
    background: #000;
    height: 110px;
    padding: 0 20px;
    font-family: Arial, sans-serif;
  }

  /* Bloc numéro de ligne : panneau noir à bordure blanche + triangle vert accolé */
  .number-block {
    display: flex;
    align-items: stretch;
    margin-right: 40px;
  }

  .line-number {
    background: #000;
    border: 3px solid #fff;
    border-right: none;
    color: #000;
    -webkit-text-stroke: 2px #ffffff;
    text-stroke: 2px #ffffff;
    font-family: "Courier New", monospace;
    font-weight: 900;
    font-size: 60px;
    letter-spacing: 2px;
    height: 84px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    padding: 0 10px 0 14px;
  }

  /* Triangle vert accolé au panneau, pointant vers la droite */
  .triangle {
    width: 0;
    height: 0;
    border-top: 45px solid transparent;
    border-bottom: 45px solid transparent;
    border-left: 34px solid #2fa22f;
    filter: drop-shadow(0 0 2px #7fe07f);
  }

  /* Texte du terminus, style LED orange */
  .destination {
    font-family: "Arial Black", "Arial", sans-serif;
    font-weight: 900;
    font-style: italic;
    font-size: 40px;
    color: #ff6a00;
    text-shadow:
      0 0 4px #ff8c00,
      0 0 10px #ff4500,
      0 0 16px #ff2d00;
    letter-spacing: 1px;
    white-space: nowrap;
  }
</style>
</head>
<body>

  <div class="display">
    <div class="number-block">
      <div class="line-number">184</div>
      <div class="triangle"></div>
    </div>
    <div class="destination">Sous-Préf. - Roseraie</div>
  </div>

</body>
</html>
