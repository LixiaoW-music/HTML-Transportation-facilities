<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>184 - Sous-Préf. - Roseraie</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a1a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Courier New', Courier, monospace;
  }

  .afficheur {
    position: relative;
    display: flex;
    align-items: center;
    background: #000000;
    padding: 12px 24px;
    border-radius: 4px;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 0 10px rgba(0,0,0,0.5);
    gap: 18px;
    min-width: 600px;
  }

  .triangle-vert {
    position: absolute;
    top: 0;
    left: 0;
    width: 0;
    height: 0;
    border-top: 18px solid #2ecc40;
    border-right: 18px solid transparent;
    filter: drop-shadow(0 0 3px rgba(46, 204, 64, 0.7));
  }

  .numero-ligne {
    color: #000000;
    font-size: 56px;
    font-weight: bold;
    letter-spacing: 2px;
    -webkit-text-stroke: 1.5px #ffffff;
    text-shadow:
      -1px -1px 0 #fff,
       1px -1px 0 #fff,
      -1px  1px 0 #fff,
       1px  1px 0 #fff,
       0 0 6px rgba(255,255,255,0.4);
    flex-shrink: 0;
    line-height: 1;
    margin-left: 10px;
  }

  .separateur {
    width: 1px;
    height: 48px;
    background: rgba(255, 140, 0, 0.25);
    flex-shrink: 0;
  }

  .terminus {
    color: #ff8c00;
    font-size: 30px;
    font-weight: normal;
    letter-spacing: 1px;
    text-shadow: 0 0 6px rgba(255, 140, 0, 0.5);
    white-space: nowrap;
    line-height: 1;
  }
</style>
</head>
<body>
  <div class="afficheur">
    <div class="triangle-vert"></div>
    <div class="numero-ligne">184</div>
    <div class="separateur"></div>
    <div class="terminus">Sous-Pr&eacute;f. - Roseraie</div>
  </div>
</body>
</html>
