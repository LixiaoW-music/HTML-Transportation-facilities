<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afficheur Bus</title>
    <style>
        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        
        .afficheur-led {
            background-color: #0a0c10;
            border: 4px solid #000;
            border-radius: 8px;
            padding: 20px 40px;
            display: flex;
            align-items: center;
            gap: 30px;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.9), 0 5px 15px rgba(0,0,0,0.5);
        }

        .numero-ligne {
            position: relative;
            background-color: #111; /* Fond par défaut */
            /* Couleur noire à l'intérieur du texte avec un contour blanc */
            color: #050505;
            -webkit-text-stroke: 2px #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 75px;
            font-weight: 900;
            padding: 5px 15px;
            letter-spacing: 3px;
            line-height: 1;
            z-index: 1;
        }

        /* Ajout du triangle rayé vert en arrière-plan */
        .numero-ligne::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Reproduit l'effet des lignes horizontales vertes */
            background: repeating-linear-gradient(
                0deg,
                #9acd32,
                #9acd32 3px,
                transparent 3px,
                transparent 6px
            );
            /* Découpe le fond pour former un triangle en haut à gauche */
            clip-path: polygon(0 0, 100% 0, 0 100%);
            z-index: -1;
        }

        .terminus {
            /* Reproduit la couleur et le style matriciel LED orange */
            color: #ff8c00;
            font-family: 'Lucida Console', Monaco, monospace;
            font-size: 42px;
            font-weight: bold;
            text-shadow: 0 0 4px rgba(255, 140, 0, 0.6);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="afficheur-led">
        <div class="numero-ligne">184</div>
        <div class="terminus">Sous-Préf. - Roseraie</div>
    </div>

</body>
</html>
